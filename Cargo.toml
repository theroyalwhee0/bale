[package]
name = "bale"
version = "0.1.0"
authors = ["Adam Mill <hismajesty@theroyalwhee.com>"]
edition = "2024"
rust-version = "1.89.0"

[[bin]]
name = "bale"
path = "src/bin/bale/main.rs"
required-features = ["bin"]

[features]
default = ["bin"]
bin = ["dep:clap"]

[dependencies]
chrono = "0.4.42"
clap = { version = "4", features = ["derive"], optional = true }
crc32fast = "1.5.0"
flate2 = "1.1.5"
fs4 = "0.13.1"
memmap2 = "0.9.9"
nom = "8.0.0"
tempfile = "3.24.0"
thiserror = "2.0.17"
zerocopy = { version = "0.8.31", features = ["derive"] }

[build-dependencies]
chrono = "0.4.42"

[dev-dependencies]
proptest = "1.9.0"
rstest = "0.26.1"
trycmd = "0.15.11"

[lints.rust]
# Deny unsafe by default, but allow with #[allow(unsafe_code)] for documented cases
# like memory mapping where the operation is inherently unsafe but well-understood.
unsafe_code = "deny"
missing_docs = "deny"

[lints.rustdoc]
missing_crate_level_docs = "deny"
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
bare_urls = "deny"
redundant_explicit_links = "deny"

[lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
disallowed_methods = "deny"
missing_docs_in_private_items = "deny"
missing_panics_doc = "deny"
missing_errors_doc = "deny"
missing_safety_doc = "deny"
